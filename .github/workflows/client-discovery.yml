name: Client Discovery Survey Checks

on:
  pull_request:
    paths:
      - 'client_discovery/**'
      - '.github/workflows/client-discovery.yml'
  push:
    branches: [main]
    paths:
      - 'client_discovery/**'
      - '.github/workflows/client-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    name: Validate offline questionnaire and analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client_discovery
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Verify standalone HTML matches source
        run: node tools/build.mjs --check
      - name: Test branching logic and reporting
        run: node tests/engine.test.cjs
      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema>=4.20,<5'
      - name: Validate questionnaires and answer fixtures
        run: python tests/schema_test.py
