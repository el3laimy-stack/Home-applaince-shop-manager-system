name: Windows preview build
on:
  push:
    branches: [codex/windows-preview-build]
  pull_request:
    paths: [.github/workflows/windows-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-preview:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Frontend/alikhlas_pos
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=APP_GIT_SHA=3957a7deec339ae8e1a547428887e285f613cc93
      - name: Upload portable Windows preview (unsigned)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ALIkhlasPOS-Windows-preview-unsigned
          path: Frontend/alikhlas_pos/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
